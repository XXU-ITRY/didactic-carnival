# ==========================================================================
#  ⚙️ تنظیمات Cloudflare Workers
# ==========================================================================
#  ⚠️ این فایل به‌طور خودکار توسط GitHub Actions ویرایش می‌شه
#     (فقط بخش KV ID — بقیه دست نخورده می‌مونه)
# ==========================================================================

name = "prpoxy"
main = "worker.js"
compatibility_date = "2024-11-01"
node_compat = true

# ─── زمان‌بندی: هر ۱ دقیقه (برای polling سروش) ──────────────────────
# اگه نمی‌خوای polling داشته باشی، این خط رو پاک کن.
[triggers]
crons = ["* * * * *"]

# ─── KV Namespace (برای ذخیره لیست منابع هر کاربر) ─────────────────
# این ID به‌طور خودکار توسط GitHub Action پر می‌شه
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

# ─── متغیرهای غیرحساس (اختیاری) ────────────────────────────────────
[vars]
SOROUSH_API_BASE = "https://api.splus.ir"
SOROUSH_USE_WEBHOOK = "false"